[platformio]
default_envs = esp32-c3-uart

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = /dev/esp32-keyword
monitor_port = /dev/esp32-keyword

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=0
    -D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
    -D EIDSP_USE_CMSIS_DSP=0
    -D EIDSP_USE_ESP_DSP=0
    -D WALLE_VERIFY_DCT=0
    -D WALLE_VERIFY_MEL=0



[env:esp32-c3-uart]
extends = env:esp32-c3

board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728

build_flags =
    ${env:esp32-c3.build_flags}
    -D WALLE_UART_AUDIO_TEST=1
    -D WALLE_AUDIO_BLOCK_MS=20


